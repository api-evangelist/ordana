name: Ordana
description: >-
  Ordana provides AI agents that run wholesale order-desk operations for
  distributors, reading every order across email, fax, PDF, EDI, voice, SMS and
  chat, resolving exceptions, communicating with retailers, and closing orders
  directly into the customer's ERP. Four agents cover the surface: Desk (end-to-end
  order automation), Voice (inbound/outbound phone ordering), Predict (cart
  prediction and AOV optimization), and Chat (text/SMS ordering). Ordana sits as an
  intelligence layer on top of existing ERP and commerce systems via pre-built
  connectors, and exposes its capabilities through a gated REST API, Webhooks, an
  MCP (Model Context Protocol) server over HTTP/SSE with OAuth 2.0, and the A2A
  agent-to-agent protocol. Surfaced as a Techstars portfolio company and enriched
  into the API Evangelist network.
